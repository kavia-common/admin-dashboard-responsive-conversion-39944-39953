<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Lock width for pixel checking while still allowing responsive preview -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Footers - Figma 11:33</title>

  <!-- Preload exact icon assets to avoid pop-in -->
  <link rel="preload" as="image" href="/assets/figmaimages/figma_image_6_95.svg">
  <link rel="preload" as="image" href="/assets/figmaimages/figma_image_6_89.svg">
  <link rel="preload" as="image" href="/assets/figmaimages/figma_image_6_91.svg">
  <link rel="preload" as="image" href="/assets/figmaimages/figma_image_6_93.svg">

  <link rel="stylesheet" href="./footers-11-33.css" />
</head>
<body>
  <main class="canvas" role="main" aria-labelledby="screen-title">
    <h1 id="screen-title" class="visually-hidden">Footers — Desktop and Mobile variants</h1>

    <!-- Desktop Footer (1318 x 120) -->
    <footer class="footer footer--desktop" aria-label="Footer desktop">
      <div class="footer__container" role="contentinfo">
        <p class="footer__copyright">© 2021 Themesberg, LLC. All rights reserved.</p>
        <nav class="footer__social" aria-label="Social links">
          <ul class="social__list" role="list">
            <li>
              <a class="social__item" href="#" aria-label="Facebook" title="Facebook">
                <img src="/assets/figmaimages/figma_image_6_95.svg" alt="" class="social__icon" width="18" height="18" />
              </a>
            </li>
            <li>
              <a class="social__item" href="#" aria-label="Twitter" title="Twitter">
                <img src="/assets/figmaimages/figma_image_6_89.svg" alt="" class="social__icon" width="18" height="18" />
              </a>
            </li>
            <li>
              <a class="social__item" href="#" aria-label="GitHub" title="GitHub">
                <img src="/assets/figmaimages/figma_image_6_91.svg" alt="" class="social__icon" width="18" height="18" />
              </a>
            </li>
            <li>
              <!-- YAML has dribbble vector without path in one node; if present use exported asset -->
              <a class="social__item" href="#" aria-label="Dribbble" title="Dribbble">
                <img src="/assets/figmaimages/figma_image_6_93.svg" alt="" class="social__icon" width="18" height="18" />
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </footer>

    <!-- Mobile Footer (409 x 176) -->
    <footer class="footer footer--mobile" aria-label="Footer mobile">
      <div class="footer__container footer__container--vertical" role="contentinfo">
        <p class="footer__copyright">© 2021 Themesberg, LLC. All rights reserved.</p>
        <nav class="footer__social" aria-label="Social links">
          <ul class="social__list" role="list">
            <li>
              <a class="social__item" href="#" aria-label="Facebook" title="Facebook">
                <img src="/assets/figmaimages/figma_image_6_95.svg" alt="" class="social__icon" width="18" height="18" />
              </a>
            </li>
            <li>
              <a class="social__item" href="#" aria-label="Twitter" title="Twitter">
                <img src="/assets/figmaimages/figma_image_6_89.svg" alt="" class="social__icon" width="18" height="18" />
              </a>
            </li>
            <li>
              <a class="social__item" href="#" aria-label="GitHub" title="GitHub">
                <img src="/assets/figmaimages/figma_image_6_91.svg" alt="" class="social__icon" width="18" height="18" />
              </a>
            </li>
            <li>
              <a class="social__item" href="#" aria-label="Dribbble" title="Dribbble">
                <img src="/assets/figmaimages/figma_image_6_93.svg" alt="" class="social__icon" width="18" height="18" />
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </footer>
  </main>
  <script src="./footers-11-33.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Lock viewport to the artboard width for pixel-accurate preview while allowing zoom -->
  <meta name="viewport" content="width=793, initial-scale=1.0, viewport-fit=cover"/>
  <title>Badges (11:31)</title>

  <!-- Performance: preload exact badge assets to avoid pop-in during pixel checking -->
  <link rel="preload" as="image" href="./figmaimages/figma_image_11_24.svg">
  <link rel="preload" as="image" href="./figmaimages/figma_image_11_22.svg">
  <link rel="preload" as="image" href="./figmaimages/figma_image_11_20.svg">

  <link rel="stylesheet" href="./badges-11-31.css"/>
</head>
<body>
  <!-- Canvas/frame sized to Figma dimensions 793x188 with white background -->

    <!-- Component set: Badge (11:34) -->

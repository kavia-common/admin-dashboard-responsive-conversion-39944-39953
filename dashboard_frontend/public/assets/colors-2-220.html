<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1191, initial-scale=1.0" />
  <title>Colors (2:220)</title>
  <link rel="stylesheet" href="./colors-2-220.css" />
</head>
<body>
  <main class="colors-screen" role="main" aria-labelledby="page-title">
    <h1 id="page-title" class="visually-hidden">Colors</h1>

    <!-- Group: Gray (Cool Gray) -->
    <section class="color-group" data-token="colors.coolGray" aria-labelledby="heading-coolgray">
      <div class="group-headings">
        <h2 id="heading-coolgray" class="group-title">Gray (Cool Gray)</h2>
        <div class="group-token">colors.coolGray</div>
      </div>
      <div class="swatch-row swatch-row--coolgray">
        <div class="swatch w-109" style="--swatch-bg:#171725" data-grade="900"><span>900</span></div>
        <div class="swatch w-109" style="--swatch-bg:#44444F" data-grade="800"><span>800</span></div>
        <div class="swatch w-109" style="--swatch-bg:#696974" data-grade="700"><span>700</span></div>
        <div class="swatch w-109" style="--swatch-bg:#92929D" data-grade="600"><span>600</span></div>
        <div class="swatch w-109" style="--swatch-bg:#B5B5BE" data-grade="500"><span>500</span></div>
        <div class="swatch w-109" style="--swatch-bg:#D5D5DC" data-grade="400"><span>400</span></div>
        <div class="swatch w-109" style="--swatch-bg:#E2E2EA" data-grade="300"><span>300</span></div>
        <div class="swatch w-109" style="--swatch-bg:#F1F1F5" data-grade="200"><span>200</span></div>
        <div class="swatch w-129" style="--swatch-bg:#F3F4F6" data-grade="100"><span>100</span></div>
        <div class="swatch w-109" style="--swatch-bg:#F9FAFB" data-grade="050"><span>050</span></div>
      </div>
    </section>

    <!-- Group: Red -->
    <section class="color-group" data-token="colors.red" aria-labelledby="heading-red">
      <div class="group-headings">
        <h2 id="heading-red" class="group-title">Red</h2>
        <div class="group-token">colors.red</div>
      </div>
      <div class="swatch-row swatch-row--red">
        <div class="swatch w-109" style="--swatch-bg:#771D1D" data-grade="900"><span>900</span></div>
        <div class="swatch w-109" style="--swatch-bg:#9B1C1C" data-grade="800"><span>800</span></div>
        <div class="swatch w-109" style="--swatch-bg:#C81E1E" data-grade="700"><span>700</span></div>
        <div class="swatch w-109" style="--swatch-bg:#E02424" data-grade="600"><span>600</span></div>
        <div class="swatch w-109" style="--swatch-bg:#F05252" data-grade="500"><span>500</span></div>
        <div class="swatch w-109" style="--swatch-bg:#F98080" data-grade="400"><span>400</span></div>
        <div class="swatch w-109" style="--swatch-bg:#F8B4B4" data-grade="300"><span>300</span></div>
        <div class="swatch w-109" style="--swatch-bg:#FBD5D5" data-grade="200"><span>200</span></div>
        <div class="swatch w-129" style="--swatch-bg:#FDE8E8" data-grade="100"><span>100</span></div>
        <div class="swatch w-109" style="--swatch-bg:#FDF2F2" data-grade="050"><span>050</span></div>
      </div>
    </section>

    <!-- Group: Green -->
    <section class="color-group" data-token="colors.green" aria-labelledby="heading-green">
      <div class="group-headings">
        <h2 id="heading-green" class="group-title">Green</h2>
        <div class="group-token">colors.green</div>
      </div>
      <div class="swatch-row swatch-row--green">
        <div class="swatch w-109" style="--swatch-bg:#014737" data-grade="900"><span>900</span></div>
        <div class="swatch w-109" style="--swatch-bg:#03543F" data-grade="800"><span>800</span></div>
        <div class="swatch w-109" style="--swatch-bg:#046C4E" data-grade="700"><span>700</span></div>
        <div class="swatch w-109" style="--swatch-bg:#057A55" data-grade="600"><span>600</span></div>
        <div class="swatch w-109" style="--swatch-bg:#0E9F6E" data-grade="500"><span>500</span></div>
        <div class="swatch w-109" style="--swatch-bg:#31C48D" data-grade="400"><span>400</span></div>
        <div class="swatch w-109" style="--swatch-bg:#84E1BC" data-grade="300"><span>300</span></div>
        <div class="swatch w-109" style="--swatch-bg:#BCF0DA" data-grade="200"><span>200</span></div>
        <div class="swatch w-129" style="--swatch-bg:#DEF7EC" data-grade="100"><span>100</span></div>
        <div class="swatch w-109" style="--swatch-bg:#F3FAF7" data-grade="050"><span>050</span></div>
      </div>
    </section>

    <!-- Group: Blue -->
    <section class="color-group" data-token="colors.blue" aria-labelledby="heading-blue">
      <div class="group-headings">
        <h2 id="heading-blue" class="group-title">Blue</h2>
        <div class="group-token">colors.blue</div>
      </div>
      <div class="swatch-row swatch-row--blue">
        <div class="swatch w-109" style="--swatch-bg:#233876" data-grade="900"><span>900</span></div>
        <div class="swatch w-109" style="--swatch-bg:#1E429F" data-grade="800"><span>800</span></div>
        <div class="swatch w-109" style="--swatch-bg:#1A56DB" data-grade="700"><span>700</span></div>
        <div class="swatch w-109" style="--swatch-bg:#1C64F2" data-grade="600"><span>600</span></div>
        <div class="swatch w-109" style="--swatch-bg:#3F83F8" data-grade="500"><span>500</span></div>
        <div class="swatch w-109" style="--swatch-bg:#76A9FA" data-grade="400"><span>400</span></div>
        <div class="swatch w-109" style="--swatch-bg:#A4CAFE" data-grade="300"><span>300</span></div>
        <div class="swatch w-109" style="--swatch-bg:#C3DDFD" data-grade="200"><span>200</span></div>
        <div class="swatch w-129" style="--swatch-bg:#E1EFFE" data-grade="100"><span>100</span></div>
        <div class="swatch w-109" style="--swatch-bg:#EBF5FF" data-grade="050"><span>050</span></div>
      </div>
    </section>
  </main>

  <script src="./colors-2-220.js"></script>
</body>
</html>

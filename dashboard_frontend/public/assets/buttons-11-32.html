<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Buttons — Figma 11:32</title>
  <!-- Lock the viewport to artboard width for pixel-perfect inspection while allowing zoom -->
  <meta name="viewport" content="width=793, initial-scale=1">
  <link rel="stylesheet" href="/assets/buttons-11-32.css">
</head>
<body>
  <!-- Canvas frame (793 x 462), white background to match Figma -->
  <main id="screen-buttons-11-32" class="canvas" role="main" aria-labelledby="button-set-title">
    <!-- Component set: Button (721 x 222) -->
    <section class="component-set" role="group" aria-roledescription="component set" aria-labelledby="button-set-title">
      <h1 id="button-set-title" class="sr-only">Button variants — Primary type, sizes xs/sm/base/l/xl and states Default, Hover, Focus</h1>

      <!-- Column XS (left-most) -->
      <div class="variant-column" data-size="xs" role="group" aria-label="Size xs">
        <figure class="variant">
          <img class="btn-img" src="/assets/figmaimages/figma_image_3_1859.png" alt="Primary XS Default button" width="87" height="32" loading="eager" decoding="async" data-state="default" data-size="xs">
          <figcaption class="sr-only">Type=Primary, Size=xs, State=Default</figcaption>
        </figure>
        <figure class="variant">
          <img class="btn-img" src="/assets/figmaimages/figma_image_3_1857.png" alt="Primary XS Hover button" width="87" height="32" loading="eager" decoding="async" data-state="hover" data-size="xs">
          <figcaption class="sr-only">Type=Primary, Size=xs, State=Hover</figcaption>
        </figure>
        <figure class="variant">
          <img class="btn-img" src="/assets/figmaimages/figma_image_3_1855.png" alt="Primary XS Focus button" width="87" height="32" loading="eager" decoding="async" data-state="focus" data-size="xs">
          <figcaption class="sr-only">Type=Primary, Size=xs, State=Focus</figcaption>
        </figure>
      </div>

      <!-- Column SM -->
      <div class="variant-column" data-size="sm" role="group" aria-label="Size sm">
        <figure class="variant">
          <img class="btn-img" src="/assets/figmaimages/figma_image_3_1853.png" alt="Primary SM Default button" width="102" height="39" loading="eager" decoding="async" data-state="default" data-size="sm">
          <figcaption class="sr-only">Type=Primary, Size=sm, State=Default</figcaption>
        </figure>
        <figure class="variant">
          <img class="btn-img" src="/assets/figmaimages/figma_image_3_1851.png" alt="Primary SM Hover button" width="102" height="39" loading="eager" decoding="async" data-state="hover" data-size="sm">
          <figcaption class="sr-only">Type=Primary, Size=sm, State=Hover</figcaption>
        </figure>
        <figure class="variant">
          <img class="btn-img" src="/assets/figmaimages/figma_image_3_1849.png" alt="Primary SM Focus button" width="102" height="39" loading="eager" decoding="async" data-state="focus" data-size="sm">
          <figcaption class="sr-only">Type=Primary, Size=sm, State=Focus</figcaption>
        </figure>
      </div>

      <!-- Column Base -->
      <div class="variant-column" data-size="base" role="group" aria-label="Size base">
        <figure class="variant">
          <img class="btn-img" src="/assets/figmaimages/figma_image_3_1847.png" alt="Primary Base Default button" width="110" height="39" loading="eager" decoding="async" data-state="default" data-size="base">
          <figcaption class="sr-only">Type=Primary, Size=base, State=Default</figcaption>
        </figure>
        <figure class="variant">
          <img class="btn-img" src="/assets/figmaimages/figma_image_3_1845.png" alt="Primary Base Hover button" width="110" height="39" loading="eager" decoding="async" data-state="hover" data-size="base">
          <figcaption class="sr-only">Type=Primary, Size=base, State=Hover</figcaption>
        </figure>
        <figure class="variant">
          <img class="btn-img" src="/assets/figmaimages/figma_image_3_1843.png" alt="Primary Base Focus button" width="110" height="39" loading="eager" decoding="async" data-state="focus" data-size="base">
          <figcaption class="sr-only">Type=Primary, Size=base, State=Focus</figcaption>
        </figure>
      </div>

      <!-- Column L -->
      <div class="variant-column" data-size="l" role="group" aria-label="Size l">
        <figure class="variant">
          <img class="btn-img" src="/assets/figmaimages/figma_image_3_1841.png" alt="Primary L Default button" width="121" height="42" loading="eager" decoding="async" data-state="default" data-size="l">
          <figcaption class="sr-only">Type=Primary, Size=l, State=Default</figcaption>
        </figure>
        <figure class="variant">
          <img class="btn-img" src="/assets/figmaimages/figma_image_3_1839.png" alt="Primary L Hover button" width="121" height="42" loading="eager" decoding="async" data-state="hover" data-size="l">
          <figcaption class="sr-only">Type=Primary, Size=l, State=Hover</figcaption>
        </figure>
        <figure class="variant">
          <img class="btn-img" src="/assets/figmaimages/figma_image_3_1837.png" alt="Primary L Focus button" width="121" height="42" loading="eager" decoding="async" data-state="focus" data-size="l">
          <figcaption class="sr-only">Type=Primary, Size=l, State=Focus</figcaption>
        </figure>
      </div>

      <!-- Column XL (right-most) -->
      <div class="variant-column" data-size="xl" role="group" aria-label="Size xl">
        <figure class="variant">
          <img class="btn-img" src="/assets/figmaimages/figma_image_3_1835.png" alt="Primary XL Default button" width="137" height="50" loading="eager" decoding="async" data-state="default" data-size="xl">
          <figcaption class="sr-only">Type=Primary, Size=xl, State=Default</figcaption>
        </figure>
        <figure class="variant">
          <img class="btn-img" src="/assets/figmaimages/figma_image_3_1833.png" alt="Primary XL Hover button" width="137" height="50" loading="eager" decoding="async" data-state="hover" data-size="xl">
          <figcaption class="sr-only">Type=Primary, Size=xl, State=Hover</figcaption>
        </figure>
        <figure class="variant">
          <img class="btn-img" src="/assets/figmaimages/figma_image_3_1831.png" alt="Primary XL Focus button" width="137" height="50" loading="eager" decoding="async" data-state="focus" data-size="xl">
          <figcaption class="sr-only">Type=Primary, Size=xl, State=Focus</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <script src="/assets/buttons-11-32.js" defer></script>
</body>
</html>

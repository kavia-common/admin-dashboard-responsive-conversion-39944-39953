<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cover (900:737)</title>
  <!-- Lock viewport to artboard width for pixel-perfect preview while allowing zoom -->
  <meta name="viewport" content="width=1800, initial-scale=1">
  <!-- Performance: Preload critical images to prevent pop-in during pixel checking -->
  <link rel="preload" as="image" href="/assets/figmaimages/figma_image_903_178.png" imagesrcset="./figmaimages/figma_image_903_178.png 1x">
  <link rel="preload" as="image" href="/assets/figmaimages/figma_image_903_177.png" imagesrcset="./figmaimages/figma_image_903_177.png 1x">
  <link rel="preload" as="image" href="/assets/figmaimages/figma_image_900_740.svg">
  <link rel="preload" as="image" href="/assets/figmaimages/figma_image_900_741.png" imagesrcset="./figmaimages/figma_image_900_741.png 1x">
  <link rel="stylesheet" href="/assets/cover-900-737.css">
</head>
<body>
  <!-- Root frame: 1800 x 993 -->
  <main id="cover-root" role="main" aria-labelledby="title">
    <!-- Left hero column -->
    <section class="left-hero" aria-labelledby="title">
      <header class="logo-row">
        <div class="logo-wrapper" aria-hidden="true">
          <img class="logo-bg" src="/assets/figmaimages/figma_image_900_740.svg" alt="" role="presentation">
          <img class="logo-img" src="/assets/figmaimages/figma_image_900_741.png" alt="Brand mark" loading="eager" decoding="async">
        </div>
        <h1 id="title" class="title">Figma Admin Dashboard</h1>
        <div class="badge" role="img" aria-label="Free badge">
          <span aria-hidden="true">FREE</span>
        </div>
      </header>

      <p class="subtitle">
        Figma Admin Dashboard is a collection of beautiful, fully responsive UI components, designed and developed by Themesberg.
      </p>

      <figure class="hero-404">
        <img src="/assets/figmaimages/figma_image_903_177.png" alt="Illustration showing a 404-themed preview" loading="lazy" decoding="async">
        <figcaption class="visually-hidden">Sample 404 layout preview</figcaption>
      </figure>
    </section>

    <!-- Right preview column -->
    <aside class="right-preview" aria-label="Overview preview">
      <img src="/assets/figmaimages/figma_image_903_178.png" alt="Overview page preview" loading="eager" decoding="async">
    </aside>
  </main>

  <script src="/assets/cover-900-737.js"></script>
</body>
</html>

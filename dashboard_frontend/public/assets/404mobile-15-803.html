<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page not found (Mobile)</title>
  <link rel="stylesheet" href="./404mobile-15-803.css">
</head>
<body>
  <!-- Mobile screen: 360x667 -->
  <div class="mobile-screen" role="main">
    
    <!-- Mobile Topbar: 360x64 -->
    <header class="mobile-topbar" role="banner">
      <button class="menu-icon" aria-label="Open menu" type="button">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4.66663 7.58334H23.3333M4.66663 14H23.3333M4.66663 20.4167H23.3333" stroke="#111827" stroke-width="2.33333" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      
      <div class="right-content">
        <button class="notification-bell" aria-label="Notifications (1 unread)" type="button">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M15 17H20L18.5951 15.5951C18.2141 15.2141 18 14.6973 18 14.1585V11C18 8.38757 16.3304 6.16509 14 5.34142V5C14 3.89543 13.1046 3 12 3C10.8954 3 10 3.89543 10 5V5.34142C7.66962 6.16509 6 8.38757 6 11V14.1585C6 14.6973 5.78595 15.2141 5.40493 15.5951L4 17H9M15 17V18C15 19.6569 13.6569 21 12 21C10.3431 21 9 19.6569 9 18V17M15 17H9" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="notification-dot" aria-hidden="true"></span>
        </button>
        
        <button class="avatar" aria-label="User profile" type="button">
          <img src="./figmaimages/figma_image_15_812_4_675.png" alt="User avatar" width="32" height="32">
        </button>
      </div>
    </header>
    
    <!-- Main Container: 360x507 -->
    <main class="container">
      
      <!-- Illustration Section: 360x303 -->
      <section class="illustration-section" aria-label="404 error illustration">
        <div class="illustration-404">
          <!-- Large 404 text background -->
          <div class="illustration-bg-text" aria-hidden="true">404</div>
          
          <!-- Decorative elements -->
          <img src="./figmaimages/figma_image_903_138_903_58.svg" alt="" class="illus-vec vec-58" aria-hidden="true">
          <img src="./figmaimages/figma_image_903_138_903_60.svg" alt="" class="illus-vec vec-60" aria-hidden="true">
          <img src="./figmaimages/figma_image_903_138_903_64.svg" alt="" class="illus-vec vec-64" aria-hidden="true">
          <img src="./figmaimages/figma_image_903_138_903_65.svg" alt="" class="illus-vec vec-65" aria-hidden="true">
          <img src="./figmaimages/figma_image_903_138_903_66.svg" alt="" class="illus-vec vec-66" aria-hidden="true">
          <img src="./figmaimages/figma_image_903_138_903_67.svg" alt="" class="illus-vec vec-67" aria-hidden="true">
          <img src="./figmaimages/figma_image_903_138_903_69.svg" alt="" class="illus-vec vec-69" aria-hidden="true">
          <img src="./figmaimages/figma_image_903_138_903_74.svg" alt="" class="illus-vec vec-74" aria-hidden="true">
          <img src="./figmaimages/figma_image_903_138_903_79.svg" alt="" class="illus-vec vec-79" aria-hidden="true">
        </div>
      </section>
      
      <!-- Title Section: 360x188 -->
      <section class="title-section">
        <div class="hero-text">
          <h1 class="heading">Page not found</h1>
          <p class="description">Oops! Looks like you followed a bad link. If you think this is a problem with us, please tell us.</p>
        </div>
        <button class="cta-button" type="button" aria-label="Go back to homepage">Go back home</button>
      </section>
      
    </main>
  </div>
  
  <script src="./404mobile-15-803.js"></script>
</body>
</html>
